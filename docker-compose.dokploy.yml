services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_URL: "${APP_URL:?APP_URL is required}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}"
      CERT_COUNTRY: "${CERT_COUNTRY:-SG}"
      TIMESERVER_URL: "${TIMESERVER_URL:-http://timestamp.digicert.com}"
      ALLOWED_FRAME_ANCESTORS: "${ALLOWED_FRAME_ANCESTORS:-*}"
      RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-15}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-0}"
      SIDEKIQ_THREADS: "${SIDEKIQ_THREADS:-5}"
    volumes:
      - docuseal_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  docuseal_data:
